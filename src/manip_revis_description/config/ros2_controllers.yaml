controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - junta_ombro
      - junta_cotovelo
      - junta_punho
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity